
<!DOCTYPE html>
<html>
<head>
    <title>Bec cu contor</title>

    <script>
        var contor = 0;

        function schimbaBecul() {
            var bec = document.getElementById("bec");

            if (bec.src.match("Bec%20stins.gif")) {
                bec.src = "Bec aprins.gif";
                contor++;
            } else {
                bec.src = "Bec stins.gif";
            }

            document.getElementById("mesaj").innerHTML =
                "Becul a fost aprins de " + contor + " ori.";
        }
    </script>
</head>
<body>

    <h1>Bec cu contor</h1>

    <img id="bec" src="Bec stins.gif" width="100" height="180"
         onclick="schimbaBecul()">

    <p id="mesaj">Becul a fost aprins de 0 ori.</p>

    <p>
    <a href="index.html" style="
        display: inline-block;
        padding: 10px 20px;
        background-color: blue;
        color: white;
        text-decoration: none;
        border-radius: 8px;
    ">← Înapoi la exerciții</a>
</p>

</body>
</html>
