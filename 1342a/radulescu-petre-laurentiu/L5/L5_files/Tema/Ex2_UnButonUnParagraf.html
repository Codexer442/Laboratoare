
<!DOCTYPE html>
<html>
<head>
    <title>Modificari cu JavaScript in tag</title>
</head>
<body>

    <h1>Modificari paragraf la click pe buton</h1>

    <p id="p1">Paragraf de modificat</p>

    <button type="button"
        onclick="var x = document.getElementById('p1');
                 x.style.backgroundColor = 'pink';
                 x.style.color = 'red';">
        Click!
    </button>
    <p>
    <a href="index.html" style="
        display: inline-block;
        padding: 10px 20px;
        background-color: blue;
        color: white;
        text-decoration: none;
        border-radius: 8px;
    ">← Înapoi la exerciții</a>
</p>

</body>
</html>
