<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 5 - getElementsByClassName</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f3eaff);
            padding: 40px;
            color: #24304a;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(40, 50, 90, 0.12);
        }

        h1 {
            color: #263c68;
            font-size: 24px;
            line-height: 1.4;
        }

        .yb, .by {
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
        }

        p.by, p.yb {
            display: inline-block;
            min-width: 150px;
            padding: 15px;
            border-radius: 8px;
            font-size: 17px;
            line-height: 1.5;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #263c68;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back:hover {
            background-color: #405a91;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Exercițiul 5 – getElementsByClassName</h1>

        <h2>Modificarea culorilor folosind clase</h2>

        <div class="yb">
            <br />
            <p class="by">Text <br /> albastru <br /> pe fond <br />galben</p>
            <br />
            <p class="yb">Text <br /> galben <br /> pe fond <br />albastru</p>
            <br />
        </div>

        <div class="by">
            <br />
            <p class="by">Alt text <br /> albastru <br /> pe fond <br />galben</p>
            <br />
            <p class="yb">Alt text <br /> galben <br /> pe fond <br />albastru</p>
            <br />
        </div>

        <a href="index.html" class="back">
            ← Înapoi la laboratorul 6
        </a>

    </div>

    <script>

        var albastruGalben = document.getElementsByClassName("by");

        for (var i = 0; i < albastruGalben.length; i++) {
            if (albastruGalben[i].tagName == "P") {
                albastruGalben[i].style.color = "blue";
                albastruGalben[i].style.backgroundColor = "yellow";
            }
        }

        var galbenAlbastru = document.getElementsByClassName("yb");

        for (var i = 0; i < galbenAlbastru.length; i++) {
            if (galbenAlbastru[i].tagName == "P") {
                galbenAlbastru[i].style.color = "yellow";
                galbenAlbastru[i].style.backgroundColor = "blue";
            }
        }

    </script>

</body>
</html>
