<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 3 - Modificare paragrafe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f3eaff);
            padding: 40px;
            color: #24304a;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(40, 50, 90, 0.12);
        }

        h1 {
            color: #263c68;
        }

        .swap {
            padding: 12px 20px;
            background-color: #526da8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .swap:hover {
            background-color: #354e86;
            transform: translateY(-2px);
        }

        #p1, #p2 {
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            line-height: 1.5;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #263c68;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back:hover {
            background-color: #405a91;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Exercițiul 3 – Modificarea paragrafelor</h1>

        <button type="button" class="swap" onclick="schimbaTextele()">
            Schimba textele paragrafelor
        </button>

        <br><br>

        <p id="p1"
           style="color: blue; background-color: yellow; font-size: 20px;"
           onclick="modificaParagraf('p1')">
            Acesta este primul paragraf.
        </p>

        <p id="p2"
           style="color: red; background-color: lightgreen; font-size: 16px;"
           onclick="modificaParagraf('p2')">
            Acesta este al doilea paragraf.
        </p>

        <a href="index.html" class="back">
            ← Înapoi la laboratorul 6
        </a>

    </div>

    <script>
        function modificaParagraf(id) {
            var paragraf = document.getElementById(id);

            var textNou = prompt("Introduceti textul nou pentru paragraf:");

            if (textNou !== null) {
                paragraf.innerHTML = textNou;
            }
        }

        function schimbaTextele() {
            var p1 = document.getElementById("p1");
            var p2 = document.getElementById("p2");

            var aux = p1.innerHTML;
            p1.innerHTML = p2.innerHTML;
            p2.innerHTML = aux;
        }
    </script>

</body>
</html>
