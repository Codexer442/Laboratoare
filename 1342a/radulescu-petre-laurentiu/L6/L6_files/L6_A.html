<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 1 - Prompt</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f3eaff);
            padding: 40px;
            color: #24304a;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(40, 50, 90, 0.12);
        }

        h1 {
            color: #263c68;
        }

        #par {
            font-size: 18px;
            padding: 15px;
            background-color: #f0f3ff;
            border-radius: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #263c68;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back:hover {
            background-color: #405a91;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Exercițiul 1 – Prompt</h1>

        <p id="par">Text initial</p>

        <a href="index.html" class="back">
            ← Înapoi la laboratorul 6
        </a>

    </div>

    <script>
        var text = prompt("Introduceti noul text al paragrafului:", "Text initial");

        if (text !== null && text !== "") {
            document.getElementById("par").innerHTML = text;
        }
    </script>

</body>
</html>
