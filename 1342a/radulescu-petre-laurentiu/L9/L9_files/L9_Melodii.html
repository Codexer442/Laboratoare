
<!DOCTYPE html>
<html>
<head>
<title>Tabel melodii</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

* {
  box-sizing: border-box;
}

.loginPopup {
  position: relative;
  text-align: center;
  width: 100%;
}

.formPopup {
  display: none;
  position: fixed;
  left: 45%;
  top: 5%;
  transform: translate(-50%, 5%);
  border: 3px solid #999999;
  z-index: 9;
}

.formContainer {
  max-width: 400px;
  padding: 20px;
  background-color: #fff;
}

.formContainer input[type=text] {
  width: 80%;
  padding: 15px;
  margin: 5px 0 20px 0;
  border: none;
  background: #eee;
}
</style>
</head>

<body>

<h1>Melodii incarcate de pe server</h1>

<p>

<button onclick="getAJAX('Melodii_JSON.txt')">
Incarca array melodii de pe server
</button>

<br><br><br>

<button onclick="loadTable()">
Incarca tabel melodii
</button>

<br><br><br>

<button onclick="openFormA()">
Adauga melodie
</button>

<table id="tm">
<tr>
    <th>Titlu</th>
    <th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
    <th colspan="2" style="text-align:center">Operatii</th>
</tr>
</table>

</p>

<div><span id="raw"></span></div>

<!-- Formular adaugare melodie -->
<div class="formPopup" id="adauga">
    <form action="javascript:;" onsubmit="adaugaMasina(this)" class="formContainer">

        <h2>Adauga melodie</h2>

        <label for="titlu">
            <strong>Titlu</strong>
        </label>
        <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>

        <label for="interpretare">
            <strong>Interpret</strong>
        </label>
        <input type="text" id="interpretare" placeholder="Interpretul melodiei" name="interpretare" required>

        <label for="versuri">
            <strong>Versuri</strong>
        </label>
        <input type="text" id="versuri" placeholder="Autorul versurilor" name="versuri" required>

        <label for="muzica">
            <strong>Muzica</strong>
        </label>
        <input type="text" id="muzica" placeholder="Autorul muzicii" name="muzica" required>

        <button type="submit" class="btn">Adauga</button>

        <button type="button" class="btn cancel" onclick="closeForm('adauga')">
            Close
        </button>

    </form>
</div>

<!-- Formular modificare melodie -->
<div class="formPopup" id="modifica">
    <form action="javascript:;" onsubmit="modificaMasina()" class="formContainer">

        <h2>Modifica melodie</h2>

        <label for="titluM">
            <strong>Titlu</strong>
        </label>
        <input type="text" id="titluM" placeholder="Titlul melodiei" required>

        <label for="interpretareM">
            <strong>Interpret</strong>
        </label>
        <input type="text" id="interpretareM" placeholder="Interpretul melodiei" required>

        <label for="versuriM">
            <strong>Versuri</strong>
        </label>
        <input type="text" id="versuriM" placeholder="Autorul versurilor" required>

        <label for="muzicaM">
            <strong>Muzica</strong>
        </label>
        <input type="text" id="muzicaM" placeholder="Autorul muzicii" required>

        <button type="submit" class="btn">Modifica</button>

        <button type="button" class="btn cancel" onclick="closeForm('modifica')">
            Close
        </button>

    </form>
</div>

<script>

const melodii2Show = [];
let fileContent;
let row = 0;
let nr;

async function getAJAX(file) {
    let myObject = await fetch(file);
    fileContent = await myObject.text();
}

function loadTable() {

    document.getElementById("raw").innerHTML = fileContent;

    var melodiiStored = JSON.parse(fileContent);

    melodii2Show.length = 0;

    for (i = 0; i < melodiiStored.length; i++) {

        var m_curenta = new melodie(
            melodiiStored[i].titlu,
            melodiiStored[i].muzica,
            melodiiStored[i].versuri,
            melodiiStored[i].interpretare
        );

        melodii2Show.push(m_curenta);
    }

    afiseazaTabel();
}

function afiseazaTabel() {

    document.getElementById("tm").innerHTML =
        "<tr>" +
        "<th>Titlu</th>" +
        "<th>Interpretata de</th>" +
        "<th>Versuri</th>" +
        "<th>Muzica</th>" +
        "<th colspan='2' style='text-align:center'>Operatii</th>" +
        "</tr>";

    for (i = 0; i < melodii2Show.length; i++) {

        document.getElementById("tm").innerHTML +=
            melodii2Show[i].randNou() +
            "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
            "<td><button onclick='stergeMasina(" + i + ")'>Stergere</button></td>" +
            "</tr>";
    }
}

function modificaMasina() {

    var mMod = new melodie(
        titluM.value,
        muzicaM.value,
        versuriM.value,
        interpretareM.value
    );

    melodii2Show.splice(nr, 1, mMod);

    closeForm("modifica");

    afiseazaTabel();
}

function stergeMasina(nr) {

    melodii2Show.splice(nr, 1);

    afiseazaTabel();
}

function melodie(ti, mu, ve, i) {

    this.titlu = ti;
    this.muzica = mu;
    this.versuri = ve;
    this.interpretare = i;

    this.randNou = function() {

        return "<tr><td>" + this.titlu +
        "</td><td>" + this.interpretare +
        "</td><td>" + this.versuri +
        "</td><td>" + this.muzica + "</td>";
    }
}

function adaugaMasina(frm) {

    var mNoua = new melodie(
        frm.titlu.value,
        frm.muzica.value,
        frm.versuri.value,
        frm.interpretare.value
    );

    melodii2Show.push(mNoua);

    afiseazaTabel();

    frm.titlu.value = "";
    frm.interpretare.value = "";
    frm.versuri.value = "";
    frm.muzica.value = "";

    closeForm("adauga");
}

function openFormA() {
    document.getElementById("adauga").style.display = "block";
}

function openForm(rand) {

    let frm = document.getElementById("modifica");

    frm.style.display = "block";

    nr = rand;

    titluM.value = melodii2Show[nr].titlu;
    interpretareM.value = melodii2Show[nr].interpretare;
    versuriM.value = melodii2Show[nr].versuri;
    muzicaM.value = melodii2Show[nr].muzica;
}

function closeForm(opt) {

    document.getElementById(opt).style.display = "none";

    if (opt == "adauga") {
        titlu.value = "";
        interpretare.value = "";
        versuri.value = "";
        muzica.value = "";
    }

    if (opt == "modifica") {
        titluM.value = "";
        interpretareM.value = "";
        versuriM.value = "";
        muzicaM.value = "";
    }
}

</script>

</body>
</html>


<!--
In acest fisier am adaptat exemplul de gestiune masini pentru gestionarea melodiilor.

Am modificat:
- titlul paginii;
- antetul tabelului;
- constructorul melodie;
- functia randNou() pentru afisarea datelor unei melodii;
- incarcarea datelor din fisierul Melodii_JSON.txt;
- array-ul melodii2Show.

Probleme observate:
- Butonul de stergere nu functioneaza deoarece functia stergeMasina
  foloseste array-ul masini2Show, care nu este definit in acest fisier.
- Butonul de modificare deschide formularul pentru masini deoarece
  functia openForm foloseste campurile marca, model si culoare.
- Functia modificaMasina foloseste constructorul masina si array-ul masini2Show.
- Formularul de adaugare contine campurile pentru marca, model si culoare.
- Functia adaugaMasina foloseste constructorul masina si array-ul masini2Show.
- Functiile de adaugare, modificare si stergere nu au fost adaptate complet
  pentru gestionarea melodiilor.

-->
