<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Tabel masini - Array JSON</title>
</head>
<body>

<h2>Tabel masini</h2>

<form onsubmit="return adaugaMasina()">
    <label>Marca:</label>
    <input type="text" id="marca">

    <label>Model:</label>
    <input type="text" id="model">

    <label>Culoare:</label>
    <input type="text" id="culoare">

    <label>An fabricatie:</label>
    <input type="number" id="anFab">

    <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table border="1">
    <thead>
        <tr>
            <th>Marca</th>
            <th>Model</th>
            <th>Culoare</th>
            <th>An fabricatie</th>
        </tr>
    </thead>
    <tbody id="tm">
    </tbody>
</table>

<script>

const masini2Store = [];

var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML =
    m1.randNou() + m2.randNou();

if (localStorage.carsArray) {

    let arrayJSON = localStorage.carsArray;
    var masiniStored = JSON.parse(arrayJSON);

    for (i = 0; i < masiniStored.length; i++) {
        document.getElementById("tm").innerHTML += masiniStored[i].randNou;
        masini2Store.push(masiniStored[i]);
    }
}

function masina(mk, md, cl, an) {
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;

    this.randNou = function() {
        return "<tr><td>" + this.marca +
        "</td><td>" + this.model +
        "</td><td>" + this.culoare +
        "</td><td>" + this.anFab +
        "</td></tr>";
    }
}

function valideaza(marca, model, culoare, an) {

    if (marca === "" || model === "" || culoare === "") {
        return "Completati marca, modelul si culoarea.";
    }

    var anCurent = new Date().getFullYear();

    if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
        return "Anul de fabricatie trebuie sa fie intre 1900 si " + anCurent + ".";
    }

    return "";
}

function citesteFormular() {

    var marca = document.getElementById("marca").value.trim();
    var model = document.getElementById("model").value.trim();
    var culoare = document.getElementById("culoare").value.trim();
    var an = Number(document.getElementById("anFab").value);

    var eroare = valideaza(marca, model, culoare, an);

    document.getElementById("mesaj").innerHTML = eroare;

    if (eroare !== "") {
        return null;
    }

    return new masina(marca, model, culoare, an);
}

function adaugaMasina() {

    var mNoua = citesteFormular();

    if (mNoua !== null) {

        document.getElementById("tm").innerHTML += mNoua.randNou();

        mNoua.randNou = mNoua.randNou().toString();

        masini2Store.push(mNoua);

        var myJSON = JSON.stringify(masini2Store);

        localStorage.setItem("carsArray", myJSON);
    }

    return false;
}

</script>

<!--
Exercitiul 6

masini2Store este un array in care sunt pastrate obiectele
masinilor adaugate.

carsArray este cheia din Local Storage in care se salveaza
array-ul de masini transformat in format JSON.

La reincarcarea paginii, array-ul este recuperat cu JSON.parse().
Bucla for parcurge toate elementele array-ului si adauga
fiecare masina in tabel.

Astfel, toate masinile adaugate sunt pastrate si afisate
in ordinea in care au fost introduse.
-->

</body>
</html>
